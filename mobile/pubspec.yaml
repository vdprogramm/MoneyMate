name: moneymate
description: MoneyMate - Quan ly thu chi ca nhan, Flutter and Spring Boot cloud API
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  fl_chart: ^0.70.2
  image_picker: 1.2.2
  google_mlkit_text_recognition: 0.15.1
  pdf: 3.12.0
  printing: 5.14.3
  # pdf 3.12.0 requires archive <4.1; image 4.11+ requires archive 4.4+.
  # Keep an older image release compatible with pdf and Flutter 3.47 until migration.
  image: 4.5.4
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
