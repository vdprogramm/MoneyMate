name: moneymate
description: MoneyMate - Quan ly thu chi ca nhan, Flutter and Spring Boot cloud API
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  fl_chart: ^0.70.2
  image_picker: 1.2.2
  google_mlkit_text_recognition: 0.15.1
  pdf: 3.12.0
  printing: 5.14.3
  # image 4.11.0 required archive API decodeLazy but mistakenly allowed archive 4.0.9.
  # image 4.11.1 constrains archive >=4.4.0, fixing Flutter widget tests.
  image: 4.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
