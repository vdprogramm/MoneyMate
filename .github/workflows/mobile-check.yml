name: Flutter analysis
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-check.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-check.yml']
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Flutter platform files
        working-directory: mobile
        run: flutter create . --platforms=android --project-name=moneymate
      - name: Enable Android Internet access
        working-directory: mobile
        run: python tool/configure_android.py
      - name: Get packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart
        working-directory: mobile
        run: flutter analyze
