name: Build MoneyMate Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native Android project
        working-directory: mobile
        run: flutter create . --platforms=android --project-name=moneymate
      - name: Allow HTTPS requests from Android release
        working-directory: mobile
        run: python tool/configure_android.py
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis and widget test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
      - name: Build APK using production HTTPS API
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://moneymate-api-snmi.onrender.com' }}
        run: |
          case "$API_BASE_URL" in https://*) ;; *) echo "API_BASE_URL must use HTTPS"; exit 1 ;; esac
          flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
