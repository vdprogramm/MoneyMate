name: MoneyMate Cloud API Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate live API, JWT auth, wallets, transactions and user isolation
        env:
          API_BASE_URL: https://moneymate-api-snmi.onrender.com
        run: python3 scripts/cloud_smoke.py
